[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-assets-studio"
version = "0.7.2"
description = "One desktop suite for producing and publishing digital assets: books, printables, audiobooks, YouTube, podcasts, courses and mobile apps."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [{name = "AIpath"}]
keywords = ["publishing", "kdp", "youtube", "podcast", "audiobook", "etsy",
            "automation", "llm", "self-publishing", "digital-products"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Office/Business :: News/Diary",
]
dependencies = [
    "flet[desktop]==0.28.3",
    "httpx>=0.27",
    "keyring>=25.0",
    "Pillow>=10.3",
    "reportlab>=4.1",
    "markdown>=3.6",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
voice = ["edge-tts>=6.1"]
browser = ["playwright>=1.44"]
printables = ["pypdf>=4.2", "pdf2image>=1.17"]
all = ["edge-tts>=6.1", "playwright>=1.44", "pypdf>=4.2", "pdf2image>=1.17"]

[project.urls]
Homepage = "https://github.com/anuragstpl/digital-assets-studio"
Issues = "https://github.com/anuragstpl/digital-assets-studio/issues"
Changelog = "https://github.com/anuragstpl/digital-assets-studio/blob/main/CHANGELOG.md"

[project.scripts]
digital-assets-studio = "digital_assets_studio.app:run"

[tool.setuptools.packages.find]
include = ["digital_assets_studio*"]

[tool.setuptools.package-data]
digital_assets_studio = ["assets/**/*"]
